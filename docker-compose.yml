name: task-tracker

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-task_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-task_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-task_tracker_dev_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    image: task-tracker-api-build
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-task_tracker}:${POSTGRES_PASSWORD:-task_tracker_dev_password}@db:5432/${POSTGRES_DB:-task_tracker}?schema=public
    command: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-task_tracker}:${POSTGRES_PASSWORD:-task_tracker_dev_password}@db:5432/${POSTGRES_DB:-task_tracker}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET (min 32 chars) in .env — see .env.example}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:3000/api/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
